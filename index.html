<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>FinFamily - Keuangan Keluarga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA & MOBILE APP META TAGS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinFamily">
  <meta name="theme-color" content="#4f46e5">

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <!-- MANIFEST UNTUK HOMESCREEN HP -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"FinFamily - Keuangan Keluarga","short_name":"FinFamily","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#4f46e5","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3135/3135706.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #appFrame {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
    }
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #6366f1;
      animation: spin 0.8s ease-in-out infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN INDAH SAAT APLIKASI MEMUAT -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <p style="font-size: 13px; font-weight: 600; color: #94a3b8;">Membuka FinFamily...</p>
  </div>

  <!-- FULLSCREEN RESPONSIVE IFRAME -->
  <!-- GANTI URL DI BAWAH DENGAN URL GOOGLE APPS SCRIPT WEB APP ANDA -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycb.../exec"
    allow="clipboard-read; clipboard-write; geolocation"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      const loader = document.getElementById('loadingScreen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
      }
    }
    // Fallback sembunyikan loading jika event onload lambat
    setTimeout(hideLoading, 3000);
  </script>
</body>
</html>
